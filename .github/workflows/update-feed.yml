name: Update feed and publish site

on:
  schedule:
    - cron: "17 7 * * *" # daily, after arXiv's overnight announcement
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new papers from arXiv
        run: python scripts/fetch_papers.py

      - name: Explain new papers
        continue-on-error: true
        run: python scripts/explain_papers.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          EXPLAIN_MAX: ${{ vars.EXPLAIN_MAX }}

      - name: Save the updated feed
        run: |
          if git diff --quiet -- site/papers.json; then
            echo "Feed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/papers.json
          git commit -m "Update research feed"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
