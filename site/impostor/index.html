<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaun Hai Impostor?</title>
<meta name="description" content="A party game of secret words and one impostor, played together in the same room with a phone each.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Impostor">
<meta name="theme-color" content="#c2410c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #fbf6ee;
  --surface: #ffffff;
  --ink: #2a1a1f;
  --muted: #75606a;
  --line: #ecdfd2;
  --accent: #c2410c;
  --accent-ink: #ffffff;
  --accent-soft: #fde7d3;
  --plum: #7a2e66;
  --plum-soft: #f6e3f0;
  --good: #15803d;
  --bad: #b91c1c;
  --display: "Baloo 2", system-ui, sans-serif;
  --body: "Hind", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1216; --surface: #251b20; --ink: #f6ece6; --muted: #b9a5ad; --line: #3a2c33;
    --accent: #fb923c; --accent-ink: #2a1206; --accent-soft: #3d2414; --plum: #e29ad0;
    --plum-soft: #3a2033; --good: #4ade80; --bad: #f87171; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1216; --surface: #251b20; --ink: #f6ece6; --muted: #b9a5ad; --line: #3a2c33;
  --accent: #fb923c; --accent-ink: #2a1206; --accent-soft: #3d2414; --plum: #e29ad0;
  --plum-soft: #3a2033; --good: #4ade80; --bad: #f87171; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font: 400 17px/1.5 var(--body);
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
.wrap {
  max-width: 30rem;
  margin: 0 auto;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));
}
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; }
h1 { font-size: 2.3rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.5rem; font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }
.stack > * + * { margin-top: 14px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }

/* Top bar */
.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 0 10px;
}
.bar .room { font: 700 1.05rem var(--display); letter-spacing: 0.08em; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
.dot.off { background: var(--bad); }
.link { background: none; border: 0; padding: 6px 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 0.9rem; }

/* Panels and buttons */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.btn {
  display: block; width: 100%; min-height: 54px; padding: 12px 18px;
  border: 0; border-radius: 14px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
  font: 700 1.15rem var(--display);
}
.btn.secondary { background: var(--accent-soft); color: var(--ink); }
.btn.quiet { background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: default; }
.field {
  width: 100%; min-height: 52px; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
}
textarea.field { min-height: 90px; resize: vertical; }
.code-input { text-transform: uppercase; letter-spacing: 0.3em; font: 700 1.4rem var(--display); text-align: center; }
label.lbl { display: block; font-weight: 600; margin-bottom: 6px; }

/* Home */
.hero { padding: 36px 0 22px; text-align: center; }
.hero .mask { font-size: 3.4rem; line-height: 1; }
.hero p { margin-top: 8px; }
.or { text-align: center; color: var(--muted); margin: 18px 0; font-size: 0.9rem; }

/* Lobby */
.code-big { font: 800 3rem/1 var(--display); letter-spacing: 0.18em; text-align: center; color: var(--accent); }
.players { list-style: none; margin: 0; padding: 0; }
.players li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.players li:first-child { border-top: 0; }
.players .name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.tag { font-size: 0.78rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); white-space: nowrap; }
.tag.plum { background: var(--plum-soft); color: var(--plum); }
.tag.ok { color: var(--good); background: transparent; border: 1px solid currentColor; }
.x { background: none; border: 0; color: var(--muted); font-size: 1.3rem; cursor: pointer; padding: 2px 8px; }

.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.opt:first-of-type { border-top: 0; }
.opt input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.opt .t { font-weight: 600; }
.opt .d { color: var(--muted); font-size: 0.9rem; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; min-height: 44px; background: var(--surface); border: 0; border-left: 1px solid var(--line); cursor: pointer; font-weight: 600; }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 500; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); }
details summary { cursor: pointer; font: 700 1.1rem var(--display); }

/* Secret card */
.card {
  border-radius: 22px; padding: 26px 20px; text-align: center; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); user-select: none; -webkit-user-select: none;
  min-height: 210px; display: flex; flex-direction: column; justify-content: center; gap: 10px;
}
.card.hidden { background: repeating-linear-gradient(135deg, var(--plum) 0 14px, color-mix(in srgb, var(--plum) 85%, black) 14px 28px); color: #fff; }
.card.impostor { background: var(--ink); color: var(--bg); }
.card .role { font: 700 0.95rem var(--display); letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; }
.card .word { font: 800 2.4rem/1.05 var(--display); overflow-wrap: anywhere; }
.card .note { font-size: 0.98rem; opacity: 0.92; }
.card .hint { font-size: 0.85rem; opacity: 0.75; }

/* Turn order */
.order { list-style: none; margin: 0; padding: 0; counter-reset: n; }
.order li { counter-increment: n; display: flex; gap: 12px; align-items: center; padding: 9px 12px; border-radius: 12px; }
.order li::before { content: counter(n); font: 700 1rem var(--display); color: var(--muted); width: 1.2em; text-align: right; }
.order li.now { background: var(--accent-soft); font-weight: 700; }
.order li.done { color: var(--muted); }
.style-card { border: 2px dashed var(--plum); border-radius: 16px; padding: 14px 16px; background: var(--plum-soft); }
.style-card h3 { color: var(--plum); }
.big-turn { text-align: center; padding: 8px 0; }
.big-turn .who { font: 800 2rem/1.1 var(--display); color: var(--accent); overflow-wrap: anywhere; }

/* Voting */
.votes { display: grid; gap: 10px; }
.vote-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 56px; padding: 12px 16px; border-radius: 14px; cursor: pointer;
  border: 2px solid var(--line); background: var(--surface); font-weight: 600; font-size: 1.05rem; text-align: left;
}
.vote-btn.on { border-color: var(--accent); background: var(--accent-soft); }
.vote-btn.none { border-style: dashed; }
.banner { border-radius: 14px; padding: 14px 16px; background: var(--plum-soft); color: var(--ink); }
.banner b { color: var(--plum); }

/* Results */
.summary { list-style: none; margin: 0; padding: 0; }
.summary li { padding: 8px 0; border-top: 1px solid var(--line); }
.summary li:first-child { border-top: 0; }
.roles td, .roles th { padding: 7px 4px; text-align: left; border-top: 1px solid var(--line); vertical-align: top; }
.roles { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.roles th { font-weight: 600; color: var(--muted); border-top: 0; font-size: 0.82rem; }
.roles .pts { text-align: right; font-weight: 700; white-space: nowrap; }
.plus { color: var(--good); }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; max-width: calc(100% - 32px);
  font-weight: 500; z-index: 10;
}
.center { text-align: center; }
.spacer { height: 6px; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
