<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="New research in music and audio technology from arXiv, filtered and tagged by topic.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Signal Path">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a single reading column; sticky tab bar; topic chips scroll sideways in their own track. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #161a22;
  --muted: #586172;
  --line: #dce1e8;
  --accent: #0b6a85;
  --accent-ink: #ffffff;
  --accent-soft: #e2eff3;
  --save: #a8620c;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161a21; --ink: #e5e8ed; --muted: #97a0af;
    --line: #283039; --accent: #5bb8d2; --accent-ink: #08141a; --accent-soft: #15303a;
    --save: #e6a24a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --ink: #e5e8ed; --muted: #97a0af;
  --line: #283039; --accent: #5bb8d2; --accent-ink: #08141a; --accent-soft: #15303a;
  --save: #e6a24a; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.55 var(--body);
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 44rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
header { padding-block: 28px 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; color: var(--accent); }
h1 {
  margin: 0;
  font: 700 1.9rem/1.05 var(--display);
  letter-spacing: -0.02em;
}
.lede { margin: 8px 0 0; color: var(--muted); max-width: 36rem; text-wrap: pretty; }
.status {
  margin-top: 10px;
  font: 400 0.75rem/1.4 var(--mono);
  color: var(--muted);
  letter-spacing: 0.02em;
}

/* Sticky controls */
.controls {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.controls .wrap { display: grid; gap: 10px; padding-block: 10px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tab {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 8px 6px;
  border-radius: 7px;
  font-weight: 500;
  font-size: 0.9rem;
  cursor: pointer;
  color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab .n { font: 400 0.75rem var(--mono); opacity: 0.8; }
.search {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 10px;
  padding: 9px 12px;
  font: inherit;
  font-size: 16px; /* stops iOS zooming in on focus */
}
.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-inline: -4px;
  padding: 0 4px 2px;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 0.82rem;
  cursor: pointer;
  white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { font: 400 0.72rem var(--mono); color: inherit; opacity: 0.65; margin-left: 3px; }

/* Feed */
main { padding-block: 8px 48px; }
.day {
  margin: 22px 0 8px;
  font: 500 0.72rem/1 var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.list { display: grid; gap: 10px; }
.paper {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  min-width: 0;
}
.meta {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font: 400 0.72rem/1.4 var(--mono);
  color: var(--muted);
}
.paper h3 {
  margin: 6px 0 4px;
  font: 600 1.05rem/1.3 var(--body);
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.paper h3 a { color: var(--ink); text-decoration: none; }
.paper h3 a:hover { text-decoration: underline; }
.authors { margin: 0; font-size: 0.85rem; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.tag {
  font-size: 0.72rem;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--ink);
}
.abstract {
  margin: 10px 0 0;
  font-size: 0.92rem;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.abstract.clamp {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-top: 10px; }
.link-btn {
  border: 0;
  background: none;
  padding: 4px 0;
  color: var(--accent);
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
}
.save {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 0.82rem;
  cursor: pointer;
}
.save[aria-pressed="true"] { border-color: var(--save); color: var(--save); }
.save svg { width: 14px; height: 14px; }

.explain-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 0;
  background: var(--accent-soft);
  color: var(--ink);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
}
.explain-btn[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); }
.explain {
  margin-top: 12px;
  padding: 14px;
  border-radius: 10px;
  background: var(--accent-soft);
  display: grid;
  gap: 10px;
  font-size: 0.92rem;
}
.explain h4 {
  margin: 0 0 2px;
  font: 500 0.7rem/1.2 var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.explain p { margin: 0; }
.explain .tldr { font-weight: 600; font-size: 0.98rem; }
.explain dl { margin: 0; display: grid; gap: 6px; }
.explain dt { font-weight: 600; }
.explain dd { margin: 0; color: var(--muted); }
.explain .by { font: 400 0.7rem/1.4 var(--mono); color: var(--muted); }

.empty {
  margin-top: 24px;
  padding: 22px 18px;
  border: 1px dashed var(--line);
  border-radius: 12px;
  color: var(--muted);
  text-align: left;
}
.empty strong { color: var(--ink); display: block; margin-bottom: 4px; }
.note { font-size: 0.85rem; color: var(--muted); margin: 18px 0 0; }

@media (prefers-reduced-motion: no-preference) {
  .paper { transition: border-color 120ms; }
}
</style>
</head>
<body>

<header class="wrap">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
      <path d="M2 15h5l3-9 5 18 4-13 3 6 2-2h4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Signal Path</h1>
  </div>
  <p class="lede">New research in music and audio technology, pulled daily from arXiv (cs.SD and eess.AS) and sorted by topic.</p>
  <div class="status" id="status">Loading feed…</div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-latest" data-tab="latest">Latest <span class="n" id="n-latest"></span></button>
      <button class="tab" role="tab" id="tab-start" data-tab="start">Start here</button>
      <button class="tab" role="tab" id="tab-saved" data-tab="saved">Saved <span class="n" id="n-saved"></span></button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search titles, abstracts, authors" autocomplete="off" aria-label="Search papers">
    <div class="chips" id="chips"></div>
  </div>
</div>

<main class="wrap" id="main"></main>

<script>
const TOPICS = [
  { id: "gen", label: "AI generation" },
  { id: "sep", label: "Source separation" },
  { id: "mir", label: "Transcription & MIR" },
  { id: "syn", label: "Synthesis & DSP" },
  { id: "spa", label: "Spatial audio" },
  { id: "hci", label: "Instruments & interaction" },
  { id: "rep", label: "Audio representations" },
];
const TOPIC_LABEL = Object.fromEntries(TOPICS.map(t => [t.id, t.label]));

// Landmark papers to build background knowledge. Summaries are short plain-English notes.
const CLASSICS = [
  ["1609.03499", "WaveNet: A Generative Model for Raw Audio", "Aäron van den Oord et al.", 2016, ["gen", "syn"],
   "Generates audio one sample at a time with dilated causal convolutions. It showed neural networks could produce realistic raw audio and shaped most neural audio work since."],
  ["1710.11153", "Onsets and Frames: Dual-Objective Piano Transcription", "Curtis Hawthorne et al.", 2017, ["mir"],
   "Turns piano recordings into notes by predicting where notes start and where they sustain, then combining the two. A big jump in transcription accuracy."],
  ["1802.06182", "CREPE: A Convolutional Representation for Pitch Estimation", "Jong Wook Kim et al.", 2018, ["mir"],
   "A neural network that tracks pitch directly from the waveform. Still a common baseline for monophonic pitch detection."],
  ["1809.04281", "Music Transformer", "Cheng-Zhi Anna Huang et al.", 2018, ["gen"],
   "Adapts the Transformer to symbolic music with an efficient form of relative attention, so generated piano pieces stay coherent over minutes."],
  ["2001.04643", "DDSP: Differentiable Digital Signal Processing", "Jesse Engel et al.", 2020, ["syn", "gen"],
   "Puts classic synth building blocks (oscillators, filters, reverb) inside a neural network. Small models get realistic timbre and allow tricks like turning a voice into a violin."],
  ["2005.00341", "Jukebox: A Generative Model for Music", "Prafulla Dhariwal et al.", 2020, ["gen"],
   "Compresses audio into discrete codes and models them with Transformers to generate songs with singing, conditioned on genre, artist and lyrics."],
  ["2107.03312", "SoundStream: An End-to-End Neural Audio Codec", "Neil Zeghidour et al.", 2021, ["rep"],
   "A neural codec that compresses audio into tokens with residual vector quantization. Token codecs like this are the foundation of today's music language models."],
  ["2111.03017", "MT3: Multi-Task Multitrack Music Transcription", "Josh Gardner et al.", 2021, ["mir"],
   "Treats transcription as translation from spectrogram to MIDI-like tokens, handling many instruments at once with one model."],
  ["2111.05011", "RAVE: A Variational Autoencoder for Fast and High-Quality Neural Audio Synthesis", "Antoine Caillon, Philippe Esling", 2021, ["syn", "gen", "hci"],
   "A compact model that synthesizes high-quality audio in real time, popular with musicians for timbre transfer inside live setups."],
  ["2111.10003", "Differentiable Wavetable Synthesis", "Siyuan Shan et al.", 2021, ["syn"],
   "Learns wavetables directly from data, giving a neural synthesizer that is efficient and easy to interpret."],
  ["2203.09893", "A Lightweight Instrument-Agnostic Model for Polyphonic Note Transcription and Multipitch Estimation", "Rachel Bittner et al.", 2022, ["mir"],
   "The model behind Spotify's Basic Pitch: a small network that converts audio from many instruments to MIDI notes."],
  ["2206.04769", "CLAP: Learning Audio Concepts From Natural Language Supervision", "Benjamin Elizalde et al.", 2022, ["rep"],
   "Trains audio and text encoders together so sounds and descriptions share one space. This enables text search over audio and guides many text-to-audio models."],
  ["2210.13438", "High Fidelity Neural Audio Compression", "Alexandre Défossez et al.", 2022, ["rep"],
   "EnCodec, Meta's neural audio codec. Its tokens are what MusicGen and several other generators model."],
  ["2211.08553", "Hybrid Transformers for Music Source Separation", "Simon Rouard et al.", 2022, ["sep"],
   "Hybrid Transformer Demucs splits a mix into vocals, drums, bass and other stems by working in both the waveform and spectrogram domains."],
  ["2301.11325", "MusicLM: Generating Music From Text", "Andrea Agostinelli et al.", 2023, ["gen"],
   "Generates minutes of music from a text description using a hierarchy of audio tokens, from coarse structure down to fine acoustic detail."],
  ["2301.12503", "AudioLDM: Text-to-Audio Generation with Latent Diffusion Models", "Haohe Liu et al.", 2023, ["gen"],
   "Applies latent diffusion, the method behind image generators, to sound and music, guided by CLAP embeddings."],
  ["2306.00107", "MERT: Acoustic Music Understanding Model with Large-Scale Self-supervised Training", "Yizhi Li et al.", 2023, ["rep", "mir"],
   "A self-supervised model trained on large amounts of music. Its learned features work well for tagging, key, beat and other analysis tasks."],
  ["2306.05284", "Simple and Controllable Music Generation", "Jade Copet et al.", 2023, ["gen"],
   "MusicGen: a single Transformer over EnCodec tokens that generates music from text and can follow a reference melody."],
  ["2407.14358", "Stable Audio Open", "Zach Evans et al.", 2024, ["gen"],
   "An open-weights text-to-audio diffusion model trained on Creative Commons audio, good for sound design and short musical clips."],
].map(([id, title, authors, year, topics, summary]) => ({
  id, title, authors: [authors], year, topics, summary,
  category: "", url: `https://arxiv.org/abs/${id}`, pdf: `https://arxiv.org/pdf/${id}`,
}));

const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  },
};

const state = {
  tab: "latest",
  topic: "all",
  query: "",
  feed: [],
  updated: null,
  loaded: false,
  saved: store.get("signalpath.saved", {}),
  open: new Set(),
  explained: new Set(),
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function shortDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return `${MONTHS[m - 1]} ${d}, ${y}`;
}
function dayHeading(iso) {
  const today = new Date();
  const t = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
  const [y, m, d] = iso.split("-").map(Number);
  const diff = Math.round((t - Date.UTC(y, m - 1, d)) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  return shortDate(iso);
}
function authorLine(authors) {
  if (!authors || !authors.length) return "";
  if (authors.length <= 4) return authors.join(", ");
  return `${authors.slice(0, 3).join(", ")} +${authors.length - 3} more`;
}

function source() {
  if (state.tab === "start") return CLASSICS;
  if (state.tab === "saved") {
    // Prefer the feed's copy so saved papers pick up explanations added later.
    const inFeed = Object.fromEntries(state.feed.map(p => [p.id, p]));
    return Object.values(state.saved)
      .sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0))
      .map(p => inFeed[p.id] || p);
  }
  return state.feed;
}
function matchesQuery(p) {
  if (!state.query) return true;
  const hay = `${p.title} ${p.summary} ${(p.authors || []).join(" ")}`.toLowerCase();
  return state.query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function renderChips(items) {
  const counts = {};
  for (const p of items) for (const t of p.topics || []) counts[t] = (counts[t] || 0) + 1;
  const chips = [{ id: "all", label: "All", n: items.length }, ...TOPICS.map(t => ({ ...t, n: counts[t.id] || 0 }))];
  $("chips").innerHTML = chips.map(c =>
    `<button class="chip" data-topic="${c.id}" aria-pressed="${state.topic === c.id}">${esc(c.label)}<span class="n">${c.n}</span></button>`
  ).join("");
}

function explainPanel(x) {
  const terms = (x.terms || []).map(t => `<div><dt>${esc(t.term)}</dt><dd>${esc(t.meaning)}</dd></div>`).join("");
  return `<div class="explain">
    <p class="tldr">${esc(x.tldr)}</p>
    <div><h4>In plain English</h4><p>${esc(x.plain)}</p></div>
    ${x.why ? `<div><h4>Why it matters</h4><p>${esc(x.why)}</p></div>` : ""}
    ${terms ? `<div><h4>Key terms</h4><dl>${terms}</dl></div>` : ""}
    <p class="by">AI-generated from the abstract${x.model ? ` by ${esc(x.model)}` : ""}. Check the paper for details.</p>
  </div>`;
}

function card(p) {
  const saved = !!state.saved[p.id];
  const open = state.open.has(p.id);
  const explained = !!p.explain && state.explained.has(p.id);
  const when = p.published ? shortDate(p.published) : p.year || "";
  const idLine = [p.id, p.category].filter(Boolean).join(" · ");
  return `<article class="paper">
    <div class="meta"><span>arXiv:${esc(idLine)}</span><span>${esc(when)}</span></div>
    <h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h3>
    <p class="authors">${esc(authorLine(p.authors))}</p>
    ${p.topics && p.topics.length ? `<div class="tags">${p.topics.map(t => `<span class="tag">${esc(TOPIC_LABEL[t] || t)}</span>`).join("")}</div>` : ""}
    <p class="abstract${open ? "" : " clamp"}">${esc(p.summary)}</p>
    ${explained ? explainPanel(p.explain) : ""}
    <div class="actions">
      ${p.explain ? `<button class="explain-btn" data-act="explain" data-id="${esc(p.id)}" aria-expanded="${explained}">${explained ? "Hide explanation" : "Explain this paper"}</button>` : ""}
      <button class="link-btn" data-act="toggle" data-id="${esc(p.id)}">${open ? "Show less" : "Read more"}</button>
      <a class="link-btn" href="${esc(p.pdf)}" target="_blank" rel="noopener">PDF</a>
      <button class="save" data-act="save" data-id="${esc(p.id)}" aria-pressed="${saved}">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h8v12l-4-3-4 3z" fill="${saved ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        ${saved ? "Saved" : "Save"}
      </button>
    </div>
  </article>`;
}

function emptyState() {
  if (!state.loaded) return "";
  if (state.query || state.topic !== "all") {
    return `<div class="empty"><strong>No papers match.</strong>Try another topic or clear the search.</div>`;
  }
  if (state.tab === "saved") {
    return `<div class="empty"><strong>Nothing saved yet.</strong>Tap Save on any paper to keep it here. Saved papers stay on this device.</div>`;
  }
  if (state.tab === "latest") {
    return `<div class="empty"><strong>The live feed hasn't run yet.</strong>New papers appear here after the daily update fetches them from arXiv. Meanwhile, the Start here tab has landmark papers to read.</div>`;
  }
  return "";
}

function render() {
  for (const tab of document.querySelectorAll(".tab")) {
    tab.setAttribute("aria-selected", tab.dataset.tab === state.tab);
  }
  $("n-latest").textContent = state.feed.length || "";
  const savedCount = Object.keys(state.saved).length;
  $("n-saved").textContent = savedCount || "";

  const searched = source().filter(matchesQuery);
  renderChips(searched);
  const items = state.topic === "all" ? searched : searched.filter(p => (p.topics || []).includes(state.topic));

  let html = "";
  if (state.tab === "start" && !state.query && state.topic === "all") {
    html += `<p class="note">Landmark papers, oldest first. Reading a few of these makes the new work much easier to follow.</p>`;
  }
  if (!items.length) {
    html += emptyState();
  } else if (state.tab === "latest") {
    let day = null;
    let group = [];
    const flush = () => { if (group.length) html += `<h2 class="day">${esc(dayHeading(day))}</h2><div class="list">${group.join("")}</div>`; };
    for (const p of items) {
      if (p.published !== day) { flush(); day = p.published; group = []; }
      group.push(card(p));
    }
    flush();
  } else {
    html += `<div class="list" style="margin-top:14px">${items.map(card).join("")}</div>`;
  }
  $("main").innerHTML = html;

  if (!state.loaded) return;
  $("status").textContent = state.updated
    ? `Updated ${shortDate(state.updated.slice(0, 10))} · ${state.feed.length} papers from the last 45 days`
    : "Live feed not fetched yet";
}

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) {
    state.tab = tab.dataset.tab;
    state.topic = "all";
    store.set("signalpath.tab", state.tab);
    render();
    window.scrollTo({ top: 0 });
    return;
  }
  const chip = e.target.closest(".chip");
  if (chip) { state.topic = chip.dataset.topic; render(); return; }

  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.act === "toggle") {
    state.open.has(id) ? state.open.delete(id) : state.open.add(id);
  } else if (btn.dataset.act === "explain") {
    state.explained.has(id) ? state.explained.delete(id) : state.explained.add(id);
  } else if (btn.dataset.act === "save") {
    if (state.saved[id]) {
      delete state.saved[id];
    } else {
      const paper = [...state.feed, ...CLASSICS].find(p => p.id === id);
      if (paper) state.saved[id] = { ...paper, savedAt: Date.now() };
    }
    store.set("signalpath.saved", state.saved);
  }
  render();
});

$("search").addEventListener("input", e => { state.query = e.target.value.trim(); render(); });

async function init() {
  render();
  try {
    const res = await fetch("papers.json", { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      state.feed = Array.isArray(data.papers) ? data.papers : [];
      state.updated = data.updated;
    }
  } catch {}
  state.loaded = true;
  const remembered = store.get("signalpath.tab", null);
  if (remembered && remembered !== "latest") state.tab = remembered;
  else if (!state.feed.length) state.tab = "start";
  render();
}
init();
</script>
</body>
</html>
